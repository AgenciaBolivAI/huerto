<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="system-ui, sans-serif">
  <rect width="800" height="600" fill="#e0ecdb"/>
  <!-- Ruta 9 -->
  <path d="M120 0 L200 600" stroke="#b8b0a0" stroke-width="46" fill="none"/>
  <path d="M120 0 L200 600" stroke="#faf7f0" stroke-width="4" stroke-dasharray="24 18" fill="none"/>
  <text x="105" y="40" font-size="20" font-weight="700" fill="#6b6455" transform="rotate(-7 105 40)">Ruta 9 (al sur)</text>

  <!-- Urbanización -->
  <rect x="300" y="90" width="430" height="430" rx="24" fill="#c2d9b8" stroke="#558544" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="515" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#34522a">Estrellas del Sur</text>

  <!-- Acceso -->
  <path d="M180 220 L330 220" stroke="#b8b0a0" stroke-width="20"/>
  <circle cx="255" cy="220" r="14" fill="#8a6242"/>
  <text x="255" y="190" text-anchor="middle" font-size="16" font-weight="600" fill="#6b4b32">Acceso principal</text>

  <!-- Avenida central -->
  <path d="M330 220 L700 220" stroke="#d9d2c2" stroke-width="16"/>

  <!-- Lotes esquemáticos -->
  <g fill="#9bbf8d" opacity="0.8">
    <rect x="340" y="260" width="60" height="40" rx="4"/><rect x="410" y="260" width="60" height="40" rx="4"/>
    <rect x="480" y="260" width="60" height="40" rx="4"/><rect x="550" y="260" width="60" height="40" rx="4"/>
    <rect x="340" y="330" width="60" height="40" rx="4"/><rect x="410" y="330" width="60" height="40" rx="4"/>
    <rect x="340" y="400" width="60" height="40" rx="4"/><rect x="410" y="400" width="60" height="40" rx="4"/>
    <rect x="480" y="400" width="60" height="40" rx="4"/>
  </g>

  <!-- Club House -->
  <circle cx="620" cy="360" r="34" fill="#34522a"/>
  <text x="620" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Club</text>
  <text x="620" y="420" text-anchor="middle" font-size="16" font-weight="600" fill="#23371e">Club House</text>

  <!-- Vivero Rizoma del Sur -->
  <circle cx="620" cy="470" r="30" fill="#e07b39"/>
  <text x="620" y="476" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">RdS</text>
  <text x="620" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#8a4a1a">Rizoma del Sur (vivero)</text>

  <!-- Norte -->
  <g transform="translate(735 60)">
    <circle r="20" fill="#ffffff" stroke="#558544" stroke-width="3"/>
    <path d="M0 -12 L6 8 L0 3 L-6 8 Z" fill="#34522a"/>
    <text y="-26" text-anchor="middle" font-size="15" font-weight="700" fill="#34522a">N</text>
  </g>

  <text x="400" y="580" text-anchor="middle" font-size="14" fill="#6b6455">Mapa esquemático de referencia — no a escala</text>
  <text x="770" y="580" text-anchor="end" font-size="15" letter-spacing="1.5" fill="#558544">@rizomaDelSur</text>
</svg>
